name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "
            👋 Thanks for opening your first issue!

            I appreciate your feedback and will review it as soon as I can.

            Please make sure you've included:
            - A clear description of the issue
            - Steps to reproduce (if applicable)
            - Expected and actual behavior

            Thank you for contributing! 🚀"
        pr-message:  "
            🎉 Thanks for your first Pull Request!

            We really appreciate your contribution to this project.

            Before the review, please make sure:
            - ✅ The project builds successfully.
            - ✅ Tests pass.
            - ✅ Your changes follow the project's architecture and coding standards.

            A maintainer will review your PR soon.
            Thanks again for contributing! 🚀"
